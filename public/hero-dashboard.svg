    <rect x="312" y="644" width="560" height="10" rx="5" fill="#1B2A4A" fill-opacity="0.10"/>
    <rect x="312" y="664" width="430" height="10" rx="5" fill="#1B2A4A" fill-opacity="0.10"/>
    <rect x="748" y="660" width="9" height="16" rx="2" fill="#5BC8A8"/>

