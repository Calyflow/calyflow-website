<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Calyflow dashboard</title>
  <desc id="heroDesc">A recruiter's Calyflow workspace showing a project with attached documents and AI workflows running, with a CV screening report streaming in.</desc>

  <defs>
    <clipPath id="appFrame"><rect x="8" y="8" width="1184" height="764" rx="20"/></clipPath>
  </defs>

  <!-- App frame -->
  <rect x="8" y="8" width="1184" height="764" rx="20" fill="#FBF7F0" stroke="#1B2A4A" stroke-opacity="0.12"/>

  <g clip-path="url(#appFrame)">

    <!-- ===== Top bar ===== -->
    <rect x="8" y="8" width="1184" height="64" fill="#FBF7F0"/>
    <line x1="8" y1="72" x2="1192" y2="72" stroke="#1B2A4A" stroke-opacity="0.10"/>
    <!-- Logo -->
    <rect x="36" y="26" width="28" height="28" rx="8" fill="#5BC8A8"/>
    <path d="M44 40 l5 5 l9 -10" fill="none" stroke="#1B2A4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="47" font-size="22" font-weight="700" fill="#1B2A4A">Calyflow</text>
    <!-- Workspace switcher -->
    <rect x="930" y="22" width="180" height="36" rx="18" fill="#FFFFFF" stroke="#1B2A4A" stroke-opacity="0.15"/>
    <text x="950" y="45" font-size="14" fill="#1B2A4A">Marek's Agency</text>
    <path d="M1086 37 l6 7 l6 -7" fill="none" stroke="#1B2A4A" stroke-width="2" stroke-linecap="round"/>
    <!-- Avatar -->
    <circle cx="1146" cy="40" r="16" fill="#1B2A4A"/>
    <text x="1146" y="45" font-size="13" font-weight="700" fill="#FBF7F0" text-anchor="middle">M</text>

    <!-- ===== Sidebar ===== -->
    <line x1="256" y1="72" x2="256" y2="772" stroke="#1B2A4A" stroke-opacity="0.10"/>

    <g font-size="14" fill="#1B2A4A">
      <!-- Library -->
      <rect x="32" y="94" width="14" height="14" rx="3" fill="none" stroke="#1B2A4A" stroke-width="1.6" stroke-opacity="0.6"/>
      <line x1="36" y1="99" x2="42" y2="99" stroke="#1B2A4A" stroke-width="1.6" stroke-opacity="0.6"/>
      <line x1="36" y1="103" x2="42" y2="103" stroke="#1B2A4A" stroke-width="1.6" stroke-opacity="0.6"/>
      <text x="56" y="106">Workflow Library</text>

      <!-- Clients label -->
      <text x="32" y="152" font-size="11" font-weight="700" letter-spacing="1.2" fill-opacity="0.45">CLIENTS</text>

      <!-- TechNova (expanded) -->
      <path d="M32 174 l6 4 l-6 4 z" fill="#1B2A4A" fill-opacity="0.6"/>
      <text x="48" y="183" font-weight="600">TechNova</text>

      <!-- Active project -->
      <rect x="44" y="198" width="196" height="38" rx="10" fill="#5BC8A8" fill-opacity="0.22" stroke="#5BC8A8"/>
      <text x="58" y="222" font-size="13" font-weight="600">Senior DevOps – Berlin</text>

      <!-- Other project -->
      <text x="58" y="262" font-size="13" fill-opacity="0.55">Frontend Lead – Prague</text>

      <!-- Other client -->
      <path d="M32 286 l6 4 l-6 4 z" fill="none" stroke="#1B2A4A" stroke-opacity="0.5" stroke-width="1.4"/>
      <text x="48" y="296" fill-opacity="0.7">Aurora Labs</text>

      <!-- Settings -->
      <circle cx="39" cy="738" r="7" fill="none" stroke="#1B2A4A" stroke-width="1.6" stroke-opacity="0.6"/>
      <circle cx="39" cy="738" r="2.4" fill="#1B2A4A" fill-opacity="0.6"/>
      <text x="56" y="743" fill-opacity="0.7">Settings</text>
    </g>

    <!-- ===== Main: project header ===== -->
    <text x="288" y="110" font-size="13" fill="#1B2A4A" fill-opacity="0.5">TechNova / Projects</text>
    <text x="288" y="140" font-size="24" font-weight="700" fill="#1B2A4A">Senior DevOps – Berlin</text>

    <!-- Readiness chips -->
    <g font-size="13">
      <rect x="288" y="158" width="146" height="30" rx="15" fill="#5BC8A8" fill-opacity="0.22"/>
      <path d="M302 173 l5 5 l8 -9" fill="none" stroke="#1B7A5F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="322" y="178" fill="#1B2A4A" font-weight="600">Job Description</text>

      <rect x="446" y="158" width="132" height="30" rx="15" fill="#5BC8A8" fill-opacity="0.22"/>
      <path d="M460 173 l5 5 l8 -9" fill="none" stroke="#1B7A5F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="480" y="178" fill="#1B2A4A" font-weight="600">Intake Notes</text>

      <rect x="590" y="158" width="84" height="30" rx="15" fill="none" stroke="#1B2A4A" stroke-opacity="0.25"/>
      <text x="606" y="178" fill="#1B2A4A" font-weight="600">3 CVs</text>
    </g>

    <!-- ===== Workflow cards ===== -->
    <g>
      <!-- Card 1: CV Screener (running) -->
      <rect x="288" y="212" width="280" height="118" rx="14" fill="#FFFFFF" stroke="#5BC8A8" stroke-width="1.6"/>
      <text x="308" y="244" font-size="15" font-weight="700" fill="#1B2A4A">CV Screener</text>
      <circle cx="540" cy="239" r="5" fill="#5BC8A8"/>
      <text x="308" y="270" font-size="12.5" fill="#1B2A4A" fill-opacity="0.6">Running — screening CV 2 of 3</text>
      <rect x="308" y="290" width="240" height="6" rx="3" fill="#1B2A4A" fill-opacity="0.08"/>
      <rect x="308" y="290" width="158" height="6" rx="3" fill="#5BC8A8"/>

      <!-- Card 2: Sourcing Map (done) -->
      <rect x="592" y="212" width="280" height="118" rx="14" fill="#FFFFFF" stroke="#1B2A4A" stroke-opacity="0.12"/>
      <text x="612" y="244" font-size="15" font-weight="700" fill="#1B2A4A">Sourcing Map</text>
      <path d="M832 233 l5 5 l9 -10" fill="none" stroke="#1B7A5F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="612" y="270" font-size="12.5" fill="#1B2A4A" fill-opacity="0.6">Completed · output saved to project</text>
      <text x="612" y="306" font-size="13" font-weight="600" fill="#1B7A5F">View output →</text>

      <!-- Card 3: Outreach Writer (ready) -->
      <rect x="896" y="212" width="280" height="118" rx="14" fill="#FFFFFF" stroke="#1B2A4A" stroke-opacity="0.12"/>
      <text x="916" y="244" font-size="15" font-weight="700" fill="#1B2A4A">Outreach Writer</text>
      <text x="916" y="270" font-size="12.5" fill="#1B2A4A" fill-opacity="0.6">Ready · uses client deck + benefits</text>
      <rect x="916" y="284" width="74" height="30" rx="15" fill="#5BC8A8"/>
      <text x="953" y="304" font-size="13.5" font-weight="700" fill="#1B2A4A" text-anchor="middle">Run</text>
    </g>

    <!-- ===== Output panel: streaming screening report ===== -->
    <rect x="288" y="354" width="888" height="392" rx="14" fill="#FFFFFF" stroke="#1B2A4A" stroke-opacity="0.12"/>

    <text x="312" y="388" font-size="11" font-weight="700" letter-spacing="1.2" fill="#1B2A4A" fill-opacity="0.45">CV SCREENER · STREAMING</text>
    <circle cx="1124" cy="384" r="4" fill="#5BC8A8"/>
    <text x="1136" y="388" font-size="11.5" fill="#1B2A4A" fill-opacity="0.55">live</text>

    <text x="312" y="420" font-size="18" font-weight="700" fill="#1B2A4A">Screening Report: Anna Novakova</text>
    <rect x="990" y="402" width="166" height="30" rx="15" fill="#5BC8A8" fill-opacity="0.25" stroke="#5BC8A8"/>
    <text x="1073" y="422" font-size="13.5" font-weight="700" fill="#1B2A4A" text-anchor="middle">8/10 · Strong fit</text>

    <line x1="312" y1="440" x2="1152" y2="440" stroke="#1B2A4A" stroke-opacity="0.08"/>

    <text x="312" y="470" font-size="13" font-weight="700" fill="#1B2A4A">Must-have requirements</text>

    <!-- Row 1 -->
    <circle cx="320" cy="498" r="8" fill="#5BC8A8" fill-opacity="0.25"/>
    <path d="M315.5 498 l3.5 3.5 l6 -7" fill="none" stroke="#1B7A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="340" y="503" font-size="13.5" fill="#1B2A4A" font-weight="600">Kubernetes (4+ yrs)</text>
    <text x="560" y="503" font-size="12.5" fill="#1B2A4A" fill-opacity="0.55">"Led K8s platform team at Datacore, 2021–2025"</text>

    <!-- Row 2 -->
    <circle cx="320" cy="530" r="8" fill="#5BC8A8" fill-opacity="0.25"/>
    <path d="M315.5 530 l3.5 3.5 l6 -7" fill="none" stroke="#1B7A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="340" y="535" font-size="13.5" fill="#1B2A4A" font-weight="600">Terraform / IaC</text>
    <text x="560" y="535" font-size="12.5" fill="#1B2A4A" fill-opacity="0.55">"Migrated 40+ services to Terraform modules"</text>

    <!-- Row 3 (gap) -->
    <circle cx="320" cy="562" r="8" fill="#E2A33C" fill-opacity="0.25"/>
    <text x="320" y="567" font-size="12" font-weight="800" fill="#B07514" text-anchor="middle">!</text>
    <text x="340" y="567" font-size="13.5" fill="#1B2A4A" font-weight="600">On-call leadership</text>
    <text x="560" y="567" font-size="12.5" fill="#1B2A4A" fill-opacity="0.55">not evident from CV — ask in screening call</text>

    <text x="312" y="610" font-size="13" font-weight="700" fill="#1B2A4A">Strengths</text>

    <!-- Streaming text skeleton -->
    <rect x="312" y="624" width="640" height="10" rx="5" fill="#1B2A4A" fill-opacity="0.10"/>
    <rect x="312" y="644" width="560" height="10" rx="5" fill="#1B2A4A" fill-opacity="0.10"/>
    <rect x="312" y="664" width="430" height="10" rx="5" fill="#1B2A4A" fill-opacity="0.10"/>
    <rect x="748" y="660" width="9" height="16" rx="2" fill="#5BC8A8"/>

    <line x1="312" y1="700" x2="1152" y2="700" stroke="#1B2A4A" stroke-opacity="0.08"/>
    <text x="312" y="726" font-size="12" fill="#1B2A4A" fill-opacity="0.5">Run #18 · 12,384 tokens in / 1,872 out · $0.041 · saved to project files</text>

  </g>
</svg>
