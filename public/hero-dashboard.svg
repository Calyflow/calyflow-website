<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Calyflow recruiting workspace</title>
  <desc id="hero-desc">A recruiter's project for a Senior Data Engineer search: readiness chips show the job description and intake notes are attached with three CVs; workflow cards show CV Screener running, Sourcing Map completed and Outreach Writer ready; a screening report streams in with evidence-quoted must-haves and the run cost in the footer.</desc>

  <style>
    .pulse { animation: pulse 2s ease-out infinite; transform-origin: left; }
    .blink { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes pulse { 0% { opacity: 0.65; } 50% { opacity: 1; } 100% { opacity: 0.65; } }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .blink { animation: none; }
    }
    text { fill: #1B2A4A; }
    .dim { fill: rgba(27,42,74,0.55); }
    .faint { fill: rgba(27,42,74,0.4); }
    .navy { fill: #131F38; }
    .mint { fill: #1B7A5F; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
  </style>

  <!-- App window -->
  <rect x="0.5" y="0.5" width="1079" height="679" rx="20" fill="#FFFFFF" stroke="rgba(27,42,74,0.12)"/>

  <!-- Header bar -->
  <line x1="0" y1="64" x2="1080" y2="64" stroke="rgba(27,42,74,0.12)"/>
  <rect x="28" y="20" width="24" height="24" rx="7" fill="#131F38"/>
  <path d="M44 26.5a5.5 5.5 0 1 0 0 11" stroke="#5BC8A8" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <circle cx="44" cy="26.5" r="1.8" fill="#5BC8A8"/>
  <circle cx="44" cy="37.5" r="1.8" fill="#FBF7F0"/>
  <text x="62" y="38" font-size="17" font-weight="700" class="navy">Calyflow</text>

  <rect x="924" y="20" width="100" height="26" rx="9" fill="#5BC8A8"/>
  <text x="974" y="37" font-size="12.5" font-weight="600" text-anchor="middle">New run</text>
  <circle cx="1046" cy="33" r="13" fill="#F3EDE2" stroke="rgba(27,42,74,0.12)"/>
  <text x="1046" y="37" font-size="10.5" font-weight="600" text-anchor="middle" class="dim">MJ</text>

  <!-- Sidebar -->
  <path d="M0.5 64H252v615.5H20.5a20 20 0 0 1-20-20V64Z" fill="#FBF7F0"/>
  <line x1="252" y1="64" x2="252" y2="680" stroke="rgba(27,42,74,0.12)"/>

  <text x="28" y="102" font-size="11" letter-spacing="1.2" class="faint mono">CLIENTS</text>

  <rect x="16" y="116" width="224" height="76" rx="10" fill="#FFFFFF" stroke="rgba(27,42,74,0.12)"/>
  <rect x="16" y="116" width="3.5" height="76" rx="1.75" fill="#5BC8A8"/>
  <text x="32" y="142" font-size="13.5" font-weight="600">Northwind Search</text>
  <circle cx="38" cy="166" r="3" fill="#5BC8A8"/>
  <text x="48" y="170" font-size="12.5" class="mint" font-weight="600">Senior Data Engineer</text>

  <text x="32" y="226" font-size="13.5" class="dim">Atlas Partners</text>
  <text x="32" y="260" font-size="13.5" class="dim">Brightline Group</text>
  <text x="32" y="294" font-size="13.5" class="dim">Helio Ventures</text>

  <line x1="16" y1="318" x2="236" y2="318" stroke="rgba(27,42,74,0.12)"/>
  <text x="28" y="348" font-size="11" letter-spacing="1.2" class="faint mono">WORKFLOW LIBRARY</text>
  <text x="32" y="378" font-size="13" class="dim">JD Writer</text>
  <text x="32" y="406" font-size="13" class="dim">Sourcing Map</text>
  <text x="32" y="434" font-size="13" class="dim">Outreach Writer</text>
  <text x="32" y="462" font-size="13" class="dim">CV Screener</text>
  <text x="32" y="490" font-size="13" class="dim">Submission Pack</text>

  <!-- Project header + readiness chips -->
  <text x="280" y="108" font-size="19" font-weight="700" class="navy">Senior Data Engineer</text>
  <text x="280" y="130" font-size="12.5" class="dim">Northwind Search · active project</text>

  <rect x="572" y="92" width="64" height="24" rx="12" fill="rgba(91,200,168,0.22)"/>
  <text x="586" y="108" font-size="11.5" font-weight="600" class="mint">✓ JD</text>
  <rect x="644" y="92" width="124" height="24" rx="12" fill="rgba(91,200,168,0.22)"/>
  <text x="658" y="108" font-size="11.5" font-weight="600" class="mint">✓ Intake Notes</text>
  <rect x="776" y="92" width="64" height="24" rx="12" fill="#F3EDE2"/>
  <text x="790" y="108" font-size="11.5" font-weight="600" class="dim">3 CVs</text>

  <!-- Workflow cards -->
  <g>
    <rect x="280" y="152" width="244" height="128" rx="14" fill="#FFFFFF" stroke="rgba(27,42,74,0.12)"/>
    <text x="300" y="184" font-size="14.5" font-weight="600">CV Screener</text>
    <rect x="436" y="168" width="72" height="22" rx="11" fill="rgba(226,163,60,0.22)"/>
    <text x="472" y="183" font-size="11" font-weight="600" text-anchor="middle" fill="#9a6b1d">Running</text>
    <rect x="300" y="212" width="204" height="6" rx="3" fill="#F3EDE2"/>
    <rect x="300" y="212" width="128" height="6" rx="3" fill="#5BC8A8" class="pulse"/>
    <text x="300" y="248" font-size="11.5" class="dim mono">CV 2 of 3 · 23,400 tokens</text>
  </g>

  <g>
    <rect x="536" y="152" width="244" height="128" rx="14" fill="#FFFFFF" stroke="rgba(27,42,74,0.12)"/>
    <text x="556" y="184" font-size="14.5" font-weight="600">Sourcing Map</text>
    <rect x="678" y="168" width="88" height="22" rx="11" fill="rgba(91,200,168,0.22)"/>
    <text x="722" y="183" font-size="11" font-weight="600" text-anchor="middle" class="mint">✓ Completed</text>
    <text x="556" y="220" font-size="12.5" class="dim">12 boolean strings</text>
    <text x="556" y="240" font-size="12.5" class="dim">18 target companies</text>
    <text x="556" y="266" font-size="11.5" class="mono mint">view results →</text>
  </g>

  <g>
    <rect x="792" y="152" width="244" height="128" rx="14" fill="#FFFFFF" stroke="rgba(27,42,74,0.12)"/>
    <text x="812" y="184" font-size="14.5" font-weight="600">Outreach Writer</text>
    <rect x="958" y="168" width="60" height="22" rx="11" fill="#F3EDE2"/>
    <text x="988" y="183" font-size="11" font-weight="600" text-anchor="middle" class="dim">Ready</text>
    <text x="812" y="220" font-size="12.5" class="dim">Waiting on sourcing list</text>
    <rect x="812" y="236" width="68" height="26" rx="9" fill="#5BC8A8"/>
    <text x="846" y="253" font-size="12" font-weight="600" text-anchor="middle">Run</text>
  </g>

  <!-- Screening report -->
  <rect x="280" y="304" width="756" height="348" rx="14" fill="#FFFFFF" stroke="rgba(27,42,74,0.12)"/>
  <text x="304" y="338" font-size="15" font-weight="700" class="navy">Screening report — Anna Kovacs</text>
  <rect x="884" y="320" width="128" height="22" rx="11" fill="rgba(226,163,60,0.22)"/>
  <text x="948" y="335" font-size="11" font-weight="600" text-anchor="middle" fill="#9a6b1d">streaming…</text>
  <text x="304" y="360" font-size="12" class="dim">Must-have requirements · evidence quoted from the CV</text>

  <g>
    <circle cx="312" cy="392" r="8" fill="rgba(91,200,168,0.22)"/>
    <path d="m308.5 392 2.5 2.5 4.5-4.5" stroke="#1B7A5F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="330" y="396" font-size="13" font-weight="600">5+ years building data pipelines</text>
    <text x="330" y="416" font-size="12" class="dim mono">"…led the Airflow migration of 40+ ETL pipelines (2019–2025)…"</text>
  </g>

  <g>
    <circle cx="312" cy="448" r="8" fill="rgba(91,200,168,0.22)"/>
    <path d="m308.5 448 2.5 2.5 4.5-4.5" stroke="#1B7A5F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="330" y="452" font-size="13" font-weight="600">Production experience with dbt</text>
    <text x="330" y="472" font-size="12" class="dim mono">"…owns 300-model dbt project powering finance reporting…"</text>
  </g>

  <g>
    <circle cx="312" cy="504" r="8" fill="rgba(226,163,60,0.22)"/>
    <path d="M312 499.5v5.5M312 508.5v0.5" stroke="#9a6b1d" stroke-width="1.75" stroke-linecap="round" fill="none"/>
    <text x="330" y="508" font-size="13" font-weight="600">GCP certification</text>
    <text x="330" y="528" font-size="12" class="dim mono">No evidence found in CV — flag for interview</text>
  </g>

  <g>
    <circle cx="312" cy="560" r="8" fill="rgba(91,200,168,0.22)"/>
    <path d="m308.5 560 2.5 2.5 4.5-4.5" stroke="#1B7A5F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="330" y="564" font-size="13" font-weight="600">Fluent English, B2+ German</text>
    <text x="330" y="584" font-size="12" class="dim mono">"…delivered stakeholder workshops in English and German…"</text>
    <rect x="724" y="575" width="8" height="13" fill="#5BC8A8" class="blink"/>
  </g>

  <!-- Run-cost footer -->
  <line x1="280" y1="612" x2="1036" y2="612" stroke="rgba(27,42,74,0.12)"/>
  <text x="304" y="636" font-size="11.5" class="dim mono">run cost €0.38 · 41,200 tokens · your API key</text>
  <text x="1012" y="636" font-size="11.5" text-anchor="end" class="mono mint">evidence-backed · no hallucinated qualifications</text>
</svg>
